# 개발용: 이 PC의 Node/JDK 버전과 상관없이 컨테이너에서 화면·서버를 실행하고 테스트한다.
#   화면 개발 서버   : docker compose -f docker-compose.dev.yml up
#   화면 테스트      : docker compose -f docker-compose.dev.yml run --rm frontend npm test
#   서버 테스트      : docker compose -f docker-compose.dev.yml run --rm backend ./gradlew test
#   임베딩 파일 생성 : docker compose -f docker-compose.dev.yml run --rm backend ./gradlew embed
name: portfolio-dev

services:
  frontend:
    image: node:24-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev"
    ports:
      - "9000:9000"
    environment:
      API_PROXY_TARGET: http://backend:8080
    volumes:
      - ./:/app
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      - backend

  backend:
    image: gradle:9-jdk17
    working_dir: /app/backend
    command: ./gradlew bootRun
    ports:
      - "8080:8080"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      GRADLE_USER_HOME: /gradle-home
    volumes:
      - ./:/app
      - gradle_home:/gradle-home
      - backend_build:/app/backend/build
      - backend_gradle:/app/backend/.gradle

volumes:
  frontend_node_modules:
  gradle_home:
  backend_build:
  backend_gradle:
