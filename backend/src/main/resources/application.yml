spring:
  application:
    name: portfolio
  mvc:
    async:
      # 챗봇 SSE 답변 제한(60초)보다 길게 둔다. 기본값(Tomcat 30초)이면 긴 답변이 먼저 끊긴다.
      request-timeout: 90s
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:not-configured}
        chat:
          model: gemini-2.5-flash
          temperature: 0.3
        embedding:
          api-key: ${GEMINI_API_KEY:not-configured}
          text:
            model: gemini-embedding-001
            dimensions: 768

portfolio:
  vector-store-path: ${VECTOR_STORE_PATH:classpath:vector/vector-store.json}
