spring:
  application:
    name: portfolio
  mvc:
    async:
      # 챗봇 SSE 답변 제한(60초)보다 길게 둔다. 기본값(Tomcat 30초)이면 긴 답변이 먼저 끊긴다.
      request-timeout: 90s
  ai:
    google:
      genai:
        # 모델은 환경 변수로 바꿀 수 있다. 임베딩 모델/차원을 바꾸면 ./gradlew embed 로 임베딩 파일을 다시 만들어야 한다.
        api-key: ${GEMINI_API_KEY:not-configured}
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
          temperature: ${GEMINI_CHAT_TEMPERATURE:0.3}
        embedding:
          api-key: ${GEMINI_API_KEY:not-configured}
          text:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
            dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:768}

portfolio:
  vector-store-path: ${VECTOR_STORE_PATH:classpath:vector/vector-store.json}
