plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.portfolio'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'
	implementation 'org.springframework.ai:spring-ai-vector-store'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 저장소 루트의 content/ 를 classpath content/ 로 복사한다 (화면과 챗봇이 같은 원본을 쓴다)
tasks.named('processResources') {
	from('../content') {
		into 'content'
		exclude '.forbidden-terms.local.txt'
	}
}

// 콘텐츠를 임베딩해 build/vector/vector-store.json 을 만든다. GEMINI_API_KEY 환경 변수가 필요하다.
tasks.register('embed', JavaExec) {
	group = 'portfolio'
	description = '콘텐츠 임베딩 파일 생성'
	dependsOn 'classes'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'dev.portfolio.BackendApplication'
	args '--embed=' + layout.buildDirectory.file('vector/vector-store.json').get().asFile.absolutePath,
		'--spring.main.web-application-type=none'
}
